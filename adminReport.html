<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Report</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>
body{
  font-family:Poppins,sans-serif;
  background:linear-gradient(135deg,#e3f2fd,#bbdefb);
}
</style>
</head>

<body class="min-h-screen p-6">

<div class="max-w-7xl mx-auto">

  <!-- PAGE HEADER -->
  <div class="flex items-center justify-between mb-6">
    <h1 class="text-3xl font-extrabold text-blue-900">
      📊 Admin Report
    </h1>
    <span class="text-sm bg-blue-100 text-blue-800 px-4 py-1 rounded-full">
      Survey Responses
    </span>
  </div>

  <!-- TABLE CARD -->
  <div class="bg-white/70 backdrop-blur-xl border border-blue-200 rounded-2xl shadow-xl overflow-x-auto">

    <table class="min-w-full text-sm text-gray-700">
      <thead>
        <tr class="bg-blue-600 text-white text-left">
          <th class="px-4 py-3">#</th>
          <th class="px-4 py-3">User Email</th>
          <th class="px-4 py-3">Question</th>
          <th class="px-4 py-3">Answer</th>
          <th class="px-4 py-3 text-center">Result</th>
          <th class="px-4 py-3">Comment</th>
          <th class="px-4 py-3">Date</th>
        </tr>
      </thead>

      <tbody id="reportBody"></tbody>
    </table>

  </div>

</div>

<script>
/* ===== SUPABASE CONFIG ===== */
const SUPABASE_URL = "https://jzorrdpsvtvoglvxhjfi.supabase.co";
const SUPABASE_ANON_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp6b3JyZHBzdnR2b2dsdnhoamZpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjEwNDA3MzMsImV4cCI6MjA3NjYxNjczM30.HOrkOrtH03AS-q9W-E0w7woDS2ESPDIVBaS64qzDpZw";

const { createClient } = supabase;
const client = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* ===== LOAD REPORT ===== */
async function loadReport() {

  const { data, error } = await client
    .from("response")
    .select(`
      id,
      user_email,
      answer,
      comment,
      is_correct,
      created_at,
      admin:question_id ( qText )
    `)
    .order("created_at", { ascending: false });

  const tbody = document.getElementById("reportBody");
  tbody.innerHTML = "";

  if (error) {
    tbody.innerHTML = `
      <tr>
        <td colspan="7" class="text-center text-red-600 py-6">
          Error loading report
        </td>
      </tr>`;
    return;
  }

  if (!data || data.length === 0) {
    tbody.innerHTML = `
      <tr>
        <td colspan="7" class="text-center text-gray-500 py-6">
          No responses found
        </td>
      </tr>`;
    return;
  }

  let i = 1;

  data.forEach(row => {

    const tr = document.createElement("tr");
    tr.className = "border-b hover:bg-blue-50 transition";

    tr.innerHTML = `
      <td class="px-4 py-3 font-semibold">${i++}</td>

      <td class="px-4 py-3 text-blue-800">
        ${row.user_email}
      </td>

      <td class="px-4 py-3 max-w-sm">
        ${row.admin?.qText || "N/A"}
      </td>

      <td class="px-4 py-3">
        ${row.answer || "-"}
      </td>

      <td class="px-4 py-3 text-center font-bold ${
        row.is_correct ? "text-green-600" : "text-red-600"
      }">
        ${row.is_correct ? "✔ Pass" : "✘ Fail"}
      </td>

      <td class="px-4 py-3">
        ${row.comment || "-"}
      </td>

      <td class="px-4 py-3 text-sm text-gray-500">
        ${new Date(row.created_at).toLocaleString()}
      </td>
    `;

    tbody.appendChild(tr);
  });
}

document.addEventListener("DOMContentLoaded", loadReport);
</script>

</body>
</html>
