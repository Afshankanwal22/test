<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Report</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
</head>

<body class="bg-gradient-to-br from-blue-50 to-blue-100 min-h-screen p-6">

<div class="max-w-7xl mx-auto">

  <h1 class="text-3xl font-extrabold text-blue-900 mb-6">📊 Admin Report</h1>

  <div class="bg-white rounded-2xl shadow-xl overflow-x-auto">
    <table class="min-w-full text-sm text-gray-700">
      <thead class="bg-blue-100 text-blue-900">
        <tr>
          <th class="px-4 py-3">#</th>
          <th class="px-4 py-3">User Email</th>
          <th class="px-4 py-3">Question</th>
          <th class="px-4 py-3">Answer</th>
          <th class="px-4 py-3">Result</th>
          <th class="px-4 py-3">Comment</th>
          <th class="px-4 py-3">Date</th>
        </tr>
      </thead>
      <tbody id="reportBody"></tbody>
    </table>
  </div>

</div>

<script>
/* ===== SUPABASE CONFIG (REAL KEY) ===== */
const SUPABASE_URL = "https://jzorrdpsvtvoglvxhjfi.supabase.co";
const SUPABASE_ANON_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp6b3JyZHBzdnR2b2dsdnhoamZpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjEwNDA3MzMsImV4cCI6MjA3NjYxNjczM30.HOrkOrtH03AS-q9W-E0w7woDS2ESPDIVBaS64qzDpZw";

const { createClient } = supabase;
const client = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* ===== LOAD REPORT ===== */
async function loadReport() {

  const { data, error } = await client
    .from("response")
    .select(`
      id,
      user_email,
      answer,
      comment,
      is_correct,
      created_at,
      admin:question_id ( qText )
    `)
    .order("created_at", { ascending: false });

  const tbody = document.getElementById("reportBody");
  tbody.innerHTML = "";

  if (error) {
    tbody.innerHTML = `
      <tr>
        <td colspan="7" class="text-center text-red-600 py-6">
          Error loading report
        </td>
      </tr>`;
    console.error(error);
    return;
  }

  if (!data || data.length === 0) {
    tbody.innerHTML = `
      <tr>
        <td colspan="7" class="text-center text-gray-500 py-6">
          No responses found
        </td>
      </tr>`;
    return;
  }

  let i = 1;

  data.forEach(row => {
    const status = row.is_correct ? "✔ Pass" : "✘ Fail";
    const statusColor = row.is_correct ? "text-green-600" : "text-red-600";

    const tr = document.createElement("tr");
    tr.className = "hover:bg-blue-50";

    tr.innerHTML = `
      <td class="px-4 py-3">${i++}</td>
      <td class="px-4 py-3">${row.user_email}</td>
      <td class="px-4 py-3">${row.admin?.qText || "N/A"}</td>
      <td class="px-4 py-3">${row.answer || "-"}</td>
      <td class="px-4 py-3 font-semibold ${statusColor}">${status}</td>
      <td class="px-4 py-3">${row.comment || "-"}</td>
      <td class="px-4 py-3">${new Date(row.created_at).toLocaleString()}</td>
    `;
    tbody.appendChild(tr);
  });
}

loadReport();
</script>

</body>
</html>
