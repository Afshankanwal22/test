<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>User Quiz</title>

<!-- Libraries -->
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>
  /* Custom animations for smooth transitions */
  .fade-in { animation: fadeIn 0.4s ease-in-out; }
  @keyframes fadeIn { from {opacity:0;} to {opacity:1;} }

  .progress-bar { transition: width 0.5s ease-in-out; }
</style>
</head>
<body class="bg-gradient-to-br from-gray-100 via-white to-purple-50 min-h-screen p-6">

<div class="max-w-4xl mx-auto space-y-6">

  <!-- TIMER -->
  <div id="timerDisplay"
       class="text-sm font-semibold text-gray-700 bg-white/70 backdrop-blur-md px-4 py-2 rounded-full shadow-md w-fit ml-auto">
  </div>

  <!-- QUESTIONS -->
  <div id="questionsBox"></div>

  <!-- BUTTON -->
  <div class="text-center">
    <button id="submitBtns"
      class="mt-4 bg-gradient-to-r from-blue-600 to-purple-600 text-white px-8 py-3 rounded-full font-semibold shadow-lg hover:shadow-xl hover:scale-105 transition transform">
      Next
    </button>
  </div>

  <!-- RESULT -->
  <div id="resultBox" class="hidden"></div>

</div>

<script>
/* ================= SUPABASE ================= */
const SUPABASE_URL = "https://jzorrdpsvtvoglvxhjfi.supabase.co";
const SUPABASE_ANON_KEY =  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp6b3JyZHBzdnR2b2dsdnhoamZpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjEwNDA3MzMsImV4cCI6MjA3NjYxNjczM30.HOrkOrtH03AS-q9W-E0w7woDS2ESPDIVBaS64qzDpZw";
const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* ================= VARIABLES ================= */
const questionsBox = document.getElementById("questionsBox");
const submitBtns = document.getElementById("submitBtns");
const resultBox = document.getElementById("resultBox");
const timerDisplay = document.getElementById("timerDisplay");

let questions = [];
let currentIndex = 0;
let userResponses = [];
let showCommentStep = false;

/* ================= TIMER ================= */
let totalTime = 600; // 10 min
let timerInterval;

function startTimer() {
  timerInterval = setInterval(() => {
    const min = String(Math.floor(totalTime / 60)).padStart(2, "0");
    const sec = String(totalTime % 60).padStart(2, "0");
    timerDisplay.innerHTML = `⏱ Time Left: ${min}:${sec}`;

    if (totalTime <= 0) {
      clearInterval(timerInterval);
      autoSubmit();
    }
    totalTime--;
  }, 1000);
}

function autoSubmit() {
  Swal.fire("Time's Up!", "Your quiz was auto submitted.", "warning")
    .then(submitAllResponses);
}

/* ================= LOAD QUESTIONS ================= */
async function loadQuestions() {
  const { data, error } = await client
    .from("admin")
    .select("*")
    .order("id");

  if (error || !data.length) {
    questionsBox.innerHTML = "<p class='text-center text-gray-500'>No questions available</p>";
    submitBtns.classList.add("hidden");
    return;
  }

  questions = data;
  showQuestion();
  startTimer();
}

/* ================= SHOW QUESTION ================= */
function showQuestion() {
  const q = questions[currentIndex];

  questionsBox.innerHTML = `
  <div class="bg-white p-6 rounded-3xl shadow-xl border border-gray-200 fade-in space-y-4 hover:shadow-2xl transition duration-300">
    <div class="flex justify-between items-center">
      <span class="text-sm font-semibold text-gray-600">
        Question ${currentIndex + 1} of ${questions.length}
      </span>
      <div class="w-1/2 h-2 bg-gray-200 rounded-full overflow-hidden">
        <div class="h-full bg-gradient-to-r from-blue-500 to-purple-600 progress-bar rounded-full"
             style="width:${((currentIndex + 1)/questions.length)*100}%"></div>
      </div>
    </div>

    <p class="text-lg font-semibold text-gray-800 max-h-40 overflow-y-auto pr-2">${q.qText}</p>

    <div class="space-y-2">
      ${q.qType === "multiple"
        ? ["A","B","C","D"].map(opt => `
          <label class="flex items-center p-3 border rounded-xl cursor-pointer hover:bg-blue-50 transition">
            <input type="radio" name="answer" value="${q[opt]}" class="mr-3 accent-purple-600">
            <span class="text-gray-700 font-medium">${q[opt]}</span>
          </label>`).join("")
        : ["True","False"].map(opt => `
          <label class="flex items-center p-3 border rounded-xl cursor-pointer hover:bg-blue-50 transition">
            <input type="radio" name="answer" value="${opt}" class="mr-3 accent-purple-600">
            <span class="text-gray-700 font-medium">${opt}</span>
          </label>`).join("")
      }
    </div>
  </div>
  `;

  submitBtns.innerText =
    currentIndex === questions.length - 1 ? "Next" : "Next";
}

/* ================= COMMENT BOX ================= */
function showCommentBox() {
  showCommentStep = true;

  questionsBox.innerHTML = `
    <div class="bg-white p-6 rounded-3xl shadow-xl border border-gray-200 fade-in">
      <h2 class="text-xl font-bold mb-3 text-center">Final Comment (Optional)</h2>
      <textarea id="finalComment"
        class="w-full border rounded-lg p-3 resize-none text-gray-700"
        rows="4"
        placeholder="Write your feedback here..."></textarea>
    </div>
  `;

  submitBtns.innerText = "Submit Quiz";
}

/* ================= BUTTON CLICK ================= */
submitBtns.addEventListener("click", async () => {
  if (!showCommentStep) {
    const selected = document.querySelector("input[name='answer']:checked");
    const answer = selected ? selected.value : null;
    const q = questions[currentIndex];

    userResponses.push({
      question_id: q.id,
      answer,
      is_correct: answer === q.correct,
      comment: null
    });

    if (currentIndex === questions.length - 1) {
      showCommentBox();
    } else {
      currentIndex++;
      showQuestion();
    }
  } else {
    submitAllResponses();
  }
});

/* ================= SUBMIT ================= */
async function submitAllResponses() {
  clearInterval(timerInterval);

  const { data: user } = await client.auth.getUser();
  if (!user.user) {
    Swal.fire("Login required", "", "error");
    return;
  }

  const finalComment = document.getElementById("finalComment")?.value || null;
  if (finalComment) {
    userResponses.push({
      question_id: null,
      answer: null,
      is_correct: null,
      comment: finalComment
    });
  }

  const payload = userResponses.map(r => ({
    user_email: user.user.email,
    user_id: user.user.id,
    ...r
  }));

  const { error } = await client.from("response").insert(payload);
  if (error) return Swal.fire("Error", error.message, "error");

  showResult();
}

/* ================= RESULT ================= */
function showResult() {
  submitBtns.classList.add("hidden");
  questionsBox.innerHTML = "";

  const correct = userResponses.filter(r => r.is_correct).length;
  const total = questions.length;
  const percent = Math.round((correct / total) * 100);

  resultBox.classList.remove("hidden");
  resultBox.innerHTML = `
  <div class="bg-white p-8 rounded-3xl shadow-2xl max-w-xl mx-auto text-center space-y-4 fade-in">
    <h2 class="text-3xl font-extrabold text-gray-800">Quiz Completed 🎉</h2>
    <div class="flex justify-between text-lg font-medium mt-4">
      <span>Total Questions:</span><span>${total}</span>
    </div>
    <div class="flex justify-between text-lg font-medium text-green-600">
      <span>Correct:</span><span>${correct}</span>
    </div>
    <div class="flex justify-between text-lg font-medium text-red-600">
      <span>Wrong:</span><span>${total-correct}</span>
    </div>
    <h3 class="text-xl font-bold ${percent>=50?'text-green-600':'text-red-600'}">
      ${percent>=50?'PASS':'FAIL'} (${percent}%)
    </h3>
    <a href="user.html">
      <button class="mt-4 bg-gradient-to-r from-blue-600 to-purple-600 text-white px-6 py-3 rounded-full shadow-lg hover:scale-105 transition transform">
        Retry Quiz
      </button>
    </a>
  </div>
  `;
}

/* ================= START ================= */
document.addEventListener("DOMContentLoaded", loadQuestions);
</script>

</body>
</html>
