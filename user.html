<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>User Quiz</title>

<!-- Libraries -->
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>
.fade-in { animation: fadeIn 0.4s ease-in-out; }
@keyframes fadeIn { from {opacity:0;} to {opacity:1;} }
.progress-bar { transition: width 0.5s ease-in-out; }
</style>
</head>

<body class="bg-gradient-to-br from-gray-100 via-white to-purple-50 min-h-screen p-6">

<div class="max-w-4xl mx-auto space-y-6">

  <!-- TIMER -->
  <div id="timerDisplay"
    class="text-sm font-semibold text-gray-700 bg-white/70 px-4 py-2 rounded-full shadow-md w-fit ml-auto">
  </div>

  <!-- QUESTIONS -->
  <div id="questionsBox"></div>

  <!-- NEXT BUTTON -->
  <div class="text-center">
    <button id="submitBtns"
      class="mt-4 bg-gradient-to-r from-blue-600 to-purple-600 text-white px-8 py-3 rounded-full font-semibold shadow-lg hover:scale-105 transition">
      Next
    </button>
  </div>

  <!-- RESULT -->
  <div id="resultBox" class="hidden"></div>

</div>

<script>
/* ================= SUPABASE ================= */
const SUPABASE_URL = "https://jzorrdpsvtvoglvxhjfi.supabase.co";
const SUPABASE_ANON_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp6b3JyZHBzdnR2b2dsdnhoamZpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjEwNDA3MzMsImV4cCI6MjA3NjYxNjczM30.HOrkOrtH03AS-q9W-E0w7woDS2ESPDIVBaS64qzDpZw";

const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* ================= VARIABLES ================= */
const questionsBox = document.getElementById("questionsBox");
const submitBtns = document.getElementById("submitBtns");
const resultBox = document.getElementById("resultBox");
const timerDisplay = document.getElementById("timerDisplay");

let questions = [];
let currentIndex = 0;
let userResponses = [];
let showCommentStep = false;

/* ================= TIMER ================= */
let totalTime = 600;
let timerInterval;

function startTimer() {
  timerInterval = setInterval(() => {
    const min = String(Math.floor(totalTime / 60)).padStart(2, "0");
    const sec = String(totalTime % 60).padStart(2, "0");
    timerDisplay.innerHTML = `⏱ Time Left: ${min}:${sec}`;

    if (totalTime <= 0) {
      clearInterval(timerInterval);
      submitAllResponses();
    }
    totalTime--;
  }, 1000);
}

/* ================= LOAD QUESTIONS ================= */
async function loadQuestions() {
  const { data, error } = await client.from("admin").select("*").order("id");

  if (error || !data.length) {
    questionsBox.innerHTML = "<p class='text-center'>No questions</p>";
    submitBtns.classList.add("hidden");
    return;
  }

  questions = data;
  showQuestion();
  startTimer();
}

/* ================= SHOW QUESTION ================= */
function showQuestion() {
  const q = questions[currentIndex];

  questionsBox.innerHTML = `
  <div class="bg-white p-6 rounded-3xl shadow-xl fade-in space-y-4">
    <div class="flex justify-between items-center">
      <span>Question ${currentIndex + 1} of ${questions.length}</span>
      <div class="w-1/2 h-2 bg-gray-200 rounded-full">
        <div class="h-full bg-purple-600 rounded-full progress-bar"
          style="width:${((currentIndex+1)/questions.length)*100}%"></div>
      </div>
    </div>

    <p class="text-lg font-semibold">${q.qText}</p>

    <div class="space-y-2">
      ${
        q.qType === "multiple"
        ? ["A","B","C","D"].map(opt => `
          <label class="flex items-center gap-2 p-2 border rounded cursor-pointer">
            <input type="radio" name="answer" value="${q[opt]}">
            ${q[opt]}
          </label>`).join("")
        : ["True","False"].map(opt => `
          <label class="flex items-center gap-2 p-2 border rounded cursor-pointer">
            <input type="radio" name="answer" value="${opt}">
            ${opt}
          </label>`).join("")
      }
    </div>
  </div>`;
}

/* ================= COMMENT ================= */
function showCommentBox() {
  showCommentStep = true;
  questionsBox.innerHTML = `
    <div class="bg-white p-6 rounded-xl shadow">
      <h2 class="text-xl font-bold text-center mb-3">Final Comment</h2>
      <textarea id="finalComment" class="w-full border p-3 rounded"></textarea>
    </div>`;
  submitBtns.innerText = "Submit Quiz";
}

/* ================= BUTTON ================= */
submitBtns.addEventListener("click", () => {
  if (!showCommentStep) {
    const selected = document.querySelector("input[name='answer']:checked");
    const answer = selected ? selected.value : null;
    const q = questions[currentIndex];

    userResponses.push({
      question_id: q.id,
      answer,
      is_correct: answer === q.correct
    });

    if (currentIndex === questions.length - 1) showCommentBox();
    else { currentIndex++; showQuestion(); }
  } else submitAllResponses();
});

/* ================= SUBMIT ================= */
async function submitAllResponses() {
  clearInterval(timerInterval);
  showResult();
}

/* ================= RESULT + LOGOUT ================= */
function showResult() {
  submitBtns.classList.add("hidden");
  questionsBox.innerHTML = "";

  const correct = userResponses.filter(r => r.is_correct).length;
  const total = questions.length;
  const percent = Math.round((correct / total) * 100);

  resultBox.classList.remove("hidden");
  resultBox.innerHTML = `
  <div class="relative bg-white p-8 rounded-3xl shadow-xl text-center fade-in">

    <!-- LOGOUT -->
    <button onclick="logout()"
      class="absolute top-4 right-4 bg-red-500 text-white px-4 py-1 rounded-full text-sm">
      Logout
    </button>

    <h2 class="text-3xl font-bold mb-4">Quiz Result</h2>
    <p>Total: ${total}</p>
    <p class="text-green-600">Correct: ${correct}</p>
    <p class="text-red-600">Wrong: ${total - correct}</p>

    <h3 class="text-xl font-bold mt-3 ${percent>=50?'text-green-600':'text-red-600'}">
      ${percent>=50?'PASS':'FAIL'} (${percent}%)
    </h3>
  </div>`;
}

/* ================= LOGOUT ================= */
async function logout(){
  await client.auth.signOut();
  window.location.href = "index.html";
}

/* ================= START ================= */
document.addEventListener("DOMContentLoaded", loadQuestions);
</script>

</body>
</html>
