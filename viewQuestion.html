<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>View Questions</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>
body{
  font-family:Poppins,sans-serif;
  background:linear-gradient(135deg,#e3f2fd,#bbdefb);
}
.modal-box{
  transform:scale(.95);
  opacity:0;
  transition:.2s;
}
.modal-box.show{
  transform:scale(1);
  opacity:1;
}
</style>
</head>

<body class="p-6">

<h1 class="text-3xl font-bold text-blue-900 text-center mb-6">
🦠 COVID Admin – Questions
</h1>

<div class="bg-white/70 border border-blue-200 rounded-2xl shadow-xl p-6 overflow-x-auto">
<table class="w-full text-sm border-collapse">
<thead>
<tr class="bg-blue-600 text-white">
<th class="p-3">#</th>
<th class="p-3">Question</th>
<th class="p-3">Type</th>
<th class="p-3">Correct</th>
<th class="p-3 text-center">Action</th>
</tr>
</thead>
<tbody id="questionsTable"></tbody>
</table>
</div>

<!-- MODAL -->
<div id="editModal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center">
<div id="editBox" class="modal-box bg-white rounded-xl p-6 w-full max-w-md shadow-xl">

<h2 class="text-xl font-bold text-center mb-4 text-blue-800">
Edit Question
</h2>

<textarea id="editQText" class="w-full border rounded-lg p-2 mb-3"></textarea>
<input id="editCorrect" class="w-full border rounded-lg p-2 mb-4" placeholder="Correct answer">

<div class="flex justify-end gap-3">
<button id="cancelEdit" class="px-4 py-2 bg-gray-300 rounded-lg">Cancel</button>
<button id="updateBtn" class="px-4 py-2 bg-blue-600 text-white rounded-lg">Update</button>
</div>

</div>
</div>



<script src="app.js"></script>

</body>
</html>
