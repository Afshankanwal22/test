<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Survey Form</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<style>
  body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #d0e7ff, #b0d4ff, #e3f2fd);
      overflow-x: hidden;
  }

  /* Floating Virus Animation */
  .virus {
      position: absolute;
      width: 90px;
      opacity: 0.13;
      animation: float 12s infinite ease-in-out;
      z-index: -1;
  }

  @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-40px); }
      100% { transform: translateY(0px); }
  }
</style>
</head>

<body class="min-h-screen flex items-start justify-center p-6 pt-32 relative">

<!-- ================= NAVBAR ================= -->
<nav class="w-full bg-white/60 backdrop-blur-md shadow-md border-b border-blue-200 fixed top-0 left-0 z-50">
  <div class="max-w-7xl mx-auto px-6 py-3 flex justify-between items-center">
    <div class="flex items-center gap-3">
      <div class="h-10 w-10 rounded-lg bg-blue-100 flex items-center justify-center font-bold text-blue-800">H</div>
      <span class="text-xl font-bold text-blue-900">Survey Admin</span>
    </div>

    <ul class="hidden md:flex items-center gap-6 text-blue-800 font-semibold">
      <li><a href="viewQuestion.html" class="hover:text-blue-900 transition">View Questions</a></li>
      <li><a href="adminReport.html" class="hover:text-blue-900 transition">Reports</a></li>
    </ul>

    <div class="md:hidden">
      <button id="menuBtn" class="text-blue-800">
        ☰
      </button>
    </div>
  </div>
</nav>

<!-- ================= FLOATING VIRUS ICONS ================= -->
<img src="https://cdn-icons-png.flaticon.com/512/2785/2785819.png" class="virus" style="top: 10%; left: 10%;">
<img src="https://cdn-icons-png.flaticon.com/512/2785/2785819.png" class="virus" style="top: 70%; left: 80%; width: 70px;">
<img src="https://cdn-icons-png.flaticon.com/512/2785/2785819.png" class="virus" style="top: 40%; left: -5%; width: 110px;">
<img src="https://cdn-icons-png.flaticon.com/512/2785/2785819.png" class="virus" style="top: 85%; left: 30%; width: 60px;">

<!-- ================= MAIN CARD ================= -->
<div class="w-full max-w-3xl bg-white/60 backdrop-blur-2xl rounded-3xl shadow-2xl p-10 border border-blue-300/40">

  <!-- Header -->
  <div class="text-center mb-6">
    <h1 class="text-3xl font-extrabold text-blue-900 drop-shadow-md">
      COVID-19 Survey Admin Panel
    </h1>
    <p class="text-blue-600 text-sm mt-1">
      Create & manage health survey questions professionally
    </p>
  </div>

  <!-- Question Type -->
  <div class="mb-4">
    <label class="block font-semibold mb-2 text-blue-900">
      Select Question Type
    </label>
    <select id="qType" onchange="showForm()"
      class="w-full p-3 rounded-xl border border-blue-300 bg-white/80 focus:ring-2 focus:ring-blue-500">
      <option value="">-- Select Type --</option>
      <option value="multiple">Multiple Choice</option>
      <option value="tf">True / False</option>
      <option value="data">Data (Info Only)</option>
    </select>
  </div>

  <!-- Multiple Choice -->
  <div id="multipleForm" class="hidden bg-blue-50/60 p-5 rounded-2xl border border-blue-200 space-y-3">
    <textarea id="mq" placeholder="Enter question..."
      class="w-full p-3 rounded-xl border border-blue-300"></textarea>
    <input id="ma" placeholder="Option A" class="w-full p-3 rounded-xl border border-blue-300">
    <input id="mb" placeholder="Option B" class="w-full p-3 rounded-xl border border-blue-300">
    <input id="mc" placeholder="Option C" class="w-full p-3 rounded-xl border border-blue-300">
    <input id="md" placeholder="Option D" class="w-full p-3 rounded-xl border border-blue-300">

    <select id="mcorrect" class="w-full p-3 rounded-xl border border-blue-300">
      <option value="A">Correct: A</option>
      <option value="B">Correct: B</option>
      <option value="C">Correct: C</option>
      <option value="D">Correct: D</option>
    </select>
  </div>

  <!-- True False -->
  <div id="tfForm" class="hidden bg-blue-50/60 p-5 rounded-2xl border border-blue-200 space-y-3">
    <textarea id="tfq" placeholder="Enter question..."
      class="w-full p-3 rounded-xl border border-blue-300"></textarea>
    <select id="tfCorrect" class="w-full p-3 rounded-xl border border-blue-300">
      <option value="True">True</option>
      <option value="False">False</option>
    </select>
  </div>

  <!-- Data -->
  <div id="dataForm" class="hidden bg-blue-50/60 p-5 rounded-2xl border border-blue-200">
    <textarea id="dq" placeholder="Enter informational content..."
      class="w-full p-3 rounded-xl border border-blue-300"></textarea>
    <p class="text-sm text-blue-600 italic mt-1">
      *Informational question (no answer)
    </p>
  </div>

  <!-- Fail Message -->
  <div class="mt-5">
    <label class="block font-semibold text-blue-900 mb-1">
      Fail Response (optional)
    </label>
    <input id="failMessage" placeholder="Enter fail response..."
      class="w-full p-3 rounded-xl border border-blue-300">
  </div>

  <!-- Save -->
  <button id="saveBtn"
    class="w-full mt-6 bg-blue-700 hover:bg-blue-800 text-white py-3 rounded-2xl font-bold text-lg shadow-xl transition hover:scale-105">
    Save Question
  </button>
</div>

<script>
function showForm() {
  document.getElementById("multipleForm").classList.add("hidden");
  document.getElementById("tfForm").classList.add("hidden");
  document.getElementById("dataForm").classList.add("hidden");

  const type = document.getElementById("qType").value;
  if(type === "multiple") multipleForm.classList.remove("hidden");
  if(type === "tf") tfForm.classList.remove("hidden");
  if(type === "data") dataForm.classList.remove("hidden");
}
</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
<script src="app.js"></script>

</body>
</html>
